# Empties the Spack binary cache of the spack job of ci.yml once a
# month. A failed run on main keeps the packages it no longer uses, so
# that the cache could otherwise grow while the job keeps failing; the
# nightly run of ci.yml fills it again.
name: Clean the build cache

on:
  # not at the start of an hour, when GitHub delays the scheduled runs the most
  schedule:
    - cron: 47 0 1 * *
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      BUILD_CACHE: oci://ghcr.io/${{ github.repository_owner }}/tdls-spack-buildcache
    steps:
      - uses: actions/checkout@v4
      - name: Set up Spack
        uses: spack/setup-spack@v3
        with:
          spack_ref: v1.2.2
          packages_ref: develop
          buildcache: false
          spack_path: spack
      - name: Remove all the packages
        uses: ./.github/actions/clean-build-cache
        env:
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          prune: false
          wipe: true

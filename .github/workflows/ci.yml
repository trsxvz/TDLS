# Builds the library, runs the test suites and the examples, and gates
# the formatting on every push and pull request.
# The GPU examples are opt-in (TDLS_BUILD_CUDA_EXAMPLES /
# TDLS_BUILD_HIP_EXAMPLES) and stay disabled here: GitHub-hosted
# runners have no GPU. They run on machines that have a device.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Install the LLVM OpenMP runtime
        run: sudo apt-get update && sudo apt-get install -y libomp-dev
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - name: Build
        run: cmake --build build -j4
      - name: Run the test suites and the examples
        run: ctest --test-dir build --output-on-failure

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: pip install "clang-format==22.*"
      - name: Check the formatting
        run: git ls-files '*.hpp' '*.cpp' '*.cu' | xargs clang-format --dry-run --Werror

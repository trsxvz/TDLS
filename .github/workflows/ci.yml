# Builds the library, runs the test suites and the examples, and gates
# the formatting on every push and pull request.
# GitHub-hosted runners have no GPU, but the GPU compilers only need a
# device to run, not to compile: the gpu jobs build the GPU examples
# with the oldest supported CUDA and ROCm releases and with clang as a
# second CUDA frontend, and the examples report themselves skipped at
# run time (exit code 77). The stdpar device offloads are built the
# same way, one job per vendor: nvc++, the ROCm hipstdpar toolchain
# and the oneAPI pstl offload. Running any of them for real stays on
# machines that have a device.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    # The optimization axis matters: each level is a different binary,
    # and the levels catch different problems. -O1 is what the check
    # target gives users and keeps the fast signal; -O3 covers the
    # aggressive-optimizer codegen. The matrix jobs run in parallel.
    name: tests (${{ matrix.compiler }}, ${{ matrix.optimization }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        optimization: [-O1, -O3]
    steps:
      - uses: actions/checkout@v4
      - name: Install the LLVM OpenMP runtime and oneTBB
        run: sudo apt-get update && sudo apt-get install -y libomp-dev libtbb-dev
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DTDLS_TESTS_OPTIMIZATION=${{ matrix.optimization }}
      - name: Build
        run: cmake --build build -j4 --target buildtests
      - name: Run the test suites and the examples
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: tests (g++, ASan+UBSan, -O2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the LLVM OpenMP runtime and oneTBB
        run: sudo apt-get update && sudo apt-get install -y libomp-dev libtbb-dev
      - name: Configure
        # -O2 is the sanitizer sweet spot: enough optimization to
        # exercise the paths the instrumentation perturbs, while higher
        # levels elide memory accesses and the ASan checks with them.
        # -fno-sanitize-recover makes every UBSan finding fatal too, so
        # ctest actually fails instead of passing over printed errors.
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++
          -DTDLS_TESTS_OPTIMIZATION=-O2
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
      - name: Build
        run: cmake --build build -j4 --target buildtests
      - name: Run the test suites and the examples
        run: UBSAN_OPTIONS=print_stacktrace=1 ctest --test-dir build --output-on-failure

  floors:
    # Ensures the advertised compiler floors keep compiling and passing:
    # GCC 10 and Clang 12 are the oldest releases the documentation
    # claims. ubuntu-22.04 is pinned because 24.04 dropped the clang-12
    # package. The CUDA and ROCm floors are covered by the gpu jobs.
    name: floor (${{ matrix.compiler }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: g++-10
            packages: g++-10
          - compiler: clang++-12
            packages: clang-12 libomp-12-dev
    steps:
      - uses: actions/checkout@v4
      - name: Install the floor compiler and oneTBB
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }} libtbb-dev
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - name: Build
        run: cmake --build build -j4 --target buildtests
      - name: Run the test suites and the examples
        run: ctest --test-dir build --output-on-failure

  windows:
    # MSVC coverage. The windows-2019 runner is retired, so the VS 2019
    # 16.11 floor of the documentation is not reachable here; this job
    # keeps the MSVC branches compiling and passing on the current
    # toolset.
    name: tests (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release -j4 --target buildtests
      - name: Run the test suites and the examples
        run: ctest --test-dir build -C Release --output-on-failure

  gpu-cuda:
    # Cross-compilation of the GPU examples with the oldest CUDA
    # release the headers support. The container pins nvcc and its
    # host compiler together, and the CPU suites run in it as usual.
    name: gpu examples build only (nvcc 12.0, gcc 11)
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.0.1-devel-ubuntu22.04
    steps:
      - name: Install cmake and git
        # The CMake of Ubuntu 22.04 (3.22) predates CUDA 12: this job
        # also covers the by-hand C++20 request of the examples.
        run: apt-get update && apt-get install -y cmake git
      - uses: actions/checkout@v4
      - name: Configure
        # The architecture must be explicit: the `native` default
        # probes for a device.
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DTDLS_BUILD_CUDA_EXAMPLES=ON
          -DCMAKE_CUDA_ARCHITECTURES=80
      - name: Build
        run: cmake --build build -j4 --target buildtests
      - name: Run the test suites and the examples (GPU examples skip)
        run: ctest --test-dir build --output-on-failure

  gpu-clang-cuda:
    # Second CUDA frontend: clang compiles the same examples against the
    # toolkit of the container. CUDA 12.3 is the newest release clang 18
    # fully supports, so the pairing raises no version warning.
    name: gpu examples build only (clang 18 CUDA, CUDA 12.3)
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.3.2-devel-ubuntu22.04
    steps:
      - name: Install cmake, git and clang 18 (apt.llvm.org)
        run: |
          apt-get update && apt-get install -y cmake git wget gnupg
          mkdir -p /etc/apt/keyrings
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor > /etc/apt/keyrings/llvm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/llvm.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" \
            > /etc/apt/sources.list.d/llvm.list
          apt-get update && apt-get install -y clang-18
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DTDLS_BUILD_CUDA_EXAMPLES=ON
          -DCMAKE_CUDA_COMPILER=clang++-18
          -DCMAKE_CUDA_ARCHITECTURES=80
      - name: Build
        run: cmake --build build -j4 --target buildtests
      - name: Run the test suites and the examples (GPU examples skip)
        run: ctest --test-dir build --output-on-failure

  gpu-hip:
    # Same for AMD, with the oldest ROCm release that has packages for
    # a GitHub-hosted image (5.3 on Ubuntu 22.04, clang 15). Only the
    # HIP compiler, runtime and device libraries are installed, and
    # the examples go through the HIP language of CMake.
    name: gpu examples build only (ROCm 5.3, clang 15)
    runs-on: ubuntu-22.04
    env:
      ROCM_PATH: /opt/rocm
    steps:
      - uses: actions/checkout@v4
      - name: Install the ROCm 5.3 HIP toolchain
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.radeon.com/rocm/rocm.gpg.key \
            | gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/5.3 jammy main" \
            | sudo tee /etc/apt/sources.list.d/rocm.list
          # Ubuntu ships its own rocm-device-libs (5.0.0-1) in universe,
          # which apt would prefer over the AMD build (1.0.0.50300) and
          # which does not install under /opt/rocm: pin the AMD repository.
          printf 'Package: *\nPin: release o=repo.radeon.com\nPin-Priority: 600\n' \
            | sudo tee /etc/apt/preferences.d/rocm-pin-600
          sudo apt-get update
          sudo apt-get install -y hip-dev hip-runtime-amd rocm-device-libs
          echo "/opt/rocm/bin" >> "$GITHUB_PATH"
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DTDLS_BUILD_HIP_EXAMPLES=ON
          -DCMAKE_HIP_COMPILER=/opt/rocm/llvm/bin/clang++
          -DCMAKE_HIP_PLATFORM=amd
          -DCMAKE_HIP_ARCHITECTURES=gfx90a
      - name: Configure diagnostics
        if: failure()
        run: |
          ls -la /opt/rocm/ /opt/rocm/llvm/bin/clang++ /opt/rocm/bin/hipconfig || true
          /opt/rocm/llvm/bin/clang++ -v -print-targets 2>&1 | head -20 || true
          hipconfig --rocmpath || true
          cat build/CMakeFiles/CMakeConfigureLog.yaml || true
      - name: Build
        run: cmake --build build -j4 --target buildtests
      - name: Run the test suites and the examples (GPU examples skip)
        run: ctest --test-dir build --output-on-failure

  gpu-sycl:
    # Build-only check of the SYCL examples with the oneAPI DPC++
    # compiler: icpx targets spir64 SPIR-V by default, so no device is
    # needed at compile time and the binaries serve Intel GPUs at run
    # time. With the CUDA and ROCm jobs this covers the three GPU
    # vendors. Only the three SYCL targets are built: the CPU suites
    # are covered by the other jobs.
    name: gpu examples build only (icpx, SYCL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the oneAPI DPC++ compiler
        run: |
          curl -fsSL https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | sudo gpg --dearmor -o /usr/share/keyrings/oneapi.gpg
          echo "deb [signed-by=/usr/share/keyrings/oneapi.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneapi.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-compiler-dpcpp-cpp
      - name: Configure
        run: |
          source /opt/intel/oneapi/setvars.sh
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTDLS_BUILD_TESTS=OFF \
            -DCMAKE_CXX_COMPILER=icpx -DTDLS_BUILD_SYCL_EXAMPLES=ON
      - name: Build the SYCL targets
        run: |
          source /opt/intel/oneapi/setvars.sh
          cmake --build build -j4 --target \
            tdls_example_tiledlupp_implicit_ode_batch_sycl \
            tdls_example_tiledlupp_integral_equation_batch_sycl \
            tdls_example_tiledlupp_norton_law_batch_sycl

  gpu-stdpar-nvhpc:
    # Build-only check of the parallel STL offload with nvc++. The HPC
    # SDK has no compilers-only package: dpkg path-exclude filters
    # comm_libs, math_libs, profilers and examples at unpack time,
    # -stdpar=gpu needing compilers/ and cuda/ only. Capability check,
    # not a floor.
    name: gpu stdpar examples build only (nvc++ 25.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the HPC SDK compiler and CUDA components
        run: |
          printf 'path-exclude=/opt/nvidia/hpc_sdk/*/comm_libs/*\npath-exclude=/opt/nvidia/hpc_sdk/*/math_libs/*\npath-exclude=/opt/nvidia/hpc_sdk/*/profilers/*\npath-exclude=/opt/nvidia/hpc_sdk/*/examples/*\n' \
            | sudo tee /etc/dpkg/dpkg.cfg.d/nvhpc-slim
          curl -fsSL https://developer.download.nvidia.com/hpc-sdk/ubuntu/DEB-GPG-KEY-NVIDIA-HPC-SDK \
            | sudo gpg --dearmor -o /usr/share/keyrings/nvidia-hpcsdk.gpg
          echo 'deb [signed-by=/usr/share/keyrings/nvidia-hpcsdk.gpg] https://developer.download.nvidia.com/hpc-sdk/ubuntu/amd64 /' \
            | sudo tee /etc/apt/sources.list.d/nvhpc.list
          sudo apt-get update
          sudo apt-get install -y nvhpc-25-11
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DTDLS_BUILD_TESTS=OFF
          -DCMAKE_CXX_COMPILER=/opt/nvidia/hpc_sdk/Linux_x86_64/25.11/compilers/bin/nvc++
          -DTDLS_BUILD_STDPAR_DEVICE_EXAMPLES=ON
          -DTDLS_STDPAR_DEVICE_FLAGS="-stdpar=gpu -gpu=cc80"
      - name: Build the device targets
        run: >
          cmake --build build -j4 --target
          tdls_example_tiledlupp_implicit_ode_batch_stdpar_gpu
          tdls_example_tiledlupp_integral_equation_batch_stdpar_gpu
          tdls_example_tiledlupp_norton_law_batch_stdpar_gpu

  gpu-stdpar-hip:
    # Build-only check of the parallel STL offload with the ROCm clang
    # through --hipstdpar. The forwarding header is not packaged by
    # ROCm and comes from the roc-stdpar repository, pinned by commit;
    # it carries a #warning, silenced so the -Werror of the examples
    # holds. rocThrust and rocPrim back the device algorithms, oneTBB
    # the host-side ones.
    name: gpu stdpar examples build only (ROCm 6.2, hipstdpar)
    runs-on: ubuntu-22.04
    env:
      ROCM_PATH: /opt/rocm
    steps:
      - uses: actions/checkout@v4
      - name: Install the ROCm 6.2 toolchain, roc-stdpar and oneTBB
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.radeon.com/rocm/rocm.gpg.key \
            | gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/6.2.4 jammy main" \
            | sudo tee /etc/apt/sources.list.d/rocm.list
          printf 'Package: *\nPin: release o=repo.radeon.com\nPin-Priority: 600\n' \
            | sudo tee /etc/apt/preferences.d/rocm-pin-600
          sudo apt-get update
          sudo apt-get install -y hip-dev hip-runtime-amd rocm-device-libs rocm-llvm \
            rocthrust-dev rocprim-dev libtbb-dev
          git clone https://github.com/ROCm/roc-stdpar "$HOME/roc-stdpar"
          git -C "$HOME/roc-stdpar" checkout 5c7f44d8418273671671378871afc00fddc4aa14
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DTDLS_BUILD_TESTS=OFF
          -DCMAKE_CXX_COMPILER=/opt/rocm/llvm/bin/clang++
          -DTDLS_BUILD_STDPAR_DEVICE_EXAMPLES=ON
          -DTDLS_STDPAR_DEVICE_FLAGS="--hipstdpar
          --hipstdpar-path=$HOME/roc-stdpar/include --offload-arch=gfx90a
          -Wno-#warnings"
      - name: Build the device targets
        run: >
          cmake --build build -j4 --target
          tdls_example_tiledlupp_implicit_ode_batch_stdpar_gpu
          tdls_example_tiledlupp_integral_equation_batch_stdpar_gpu
          tdls_example_tiledlupp_norton_law_batch_stdpar_gpu

  gpu-stdpar-oneapi:
    # Build-only check of the parallel STL offload with icpx through
    # the oneAPI pstl offload, backed by oneDPL. Capability check, not
    # a floor.
    name: gpu stdpar examples build only (icpx, pstl offload)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the oneAPI DPC++ compiler and oneDPL
        run: |
          curl -fsSL https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | sudo gpg --dearmor -o /usr/share/keyrings/oneapi.gpg
          echo "deb [signed-by=/usr/share/keyrings/oneapi.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneapi.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-compiler-dpcpp-cpp intel-oneapi-libdpstd-devel
      - name: Configure
        run: |
          source /opt/intel/oneapi/setvars.sh
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTDLS_BUILD_TESTS=OFF \
            -DCMAKE_CXX_COMPILER=icpx -DTDLS_BUILD_STDPAR_DEVICE_EXAMPLES=ON \
            -DTDLS_STDPAR_DEVICE_FLAGS="-fsycl -fsycl-pstl-offload=gpu"
      - name: Build the device targets
        run: |
          source /opt/intel/oneapi/setvars.sh
          cmake --build build -j4 --target \
            tdls_example_tiledlupp_implicit_ode_batch_stdpar_gpu \
            tdls_example_tiledlupp_integral_equation_batch_stdpar_gpu \
            tdls_example_tiledlupp_norton_law_batch_stdpar_gpu

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: pip install "clang-format==22.*"
      - name: Check the formatting
        run: git ls-files '*.hpp' '*.cpp' '*.cu' | xargs clang-format --dry-run --Werror

# Builds the library, runs the test suites and the examples, and gates
# the formatting on every push and pull request.
# GitHub-hosted runners have no GPU, but nvcc and hipcc only need a
# device to run, not to compile: the gpu jobs build the GPU examples
# with the oldest supported CUDA and ROCm releases, and the examples
# report themselves skipped at run time (exit code 77). Running them
# for real stays on machines that have a device.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    # The optimization axis matters: each level is a different binary,
    # and the levels catch different problems. -O1 is what the check
    # target gives users and keeps the fast signal; -O3 covers the
    # aggressive-optimizer codegen. The matrix jobs run in parallel.
    name: tests (${{ matrix.compiler }}, ${{ matrix.optimization }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        optimization: [-O1, -O3]
    steps:
      - uses: actions/checkout@v4
      - name: Install the LLVM OpenMP runtime
        run: sudo apt-get update && sudo apt-get install -y libomp-dev
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DTDLS_TESTS_OPTIMIZATION=${{ matrix.optimization }}
      - name: Build
        run: cmake --build build -j4 --target buildtests
      - name: Run the test suites and the examples
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: tests (g++, ASan+UBSan, -O2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the LLVM OpenMP runtime
        run: sudo apt-get update && sudo apt-get install -y libomp-dev
      - name: Configure
        # -O2 is the sanitizer sweet spot: enough optimization to
        # exercise the paths the instrumentation perturbs, while higher
        # levels elide memory accesses and the ASan checks with them.
        # -fno-sanitize-recover makes every UBSan finding fatal too, so
        # ctest actually fails instead of passing over printed errors.
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++
          -DTDLS_TESTS_OPTIMIZATION=-O2
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
      - name: Build
        run: cmake --build build -j4 --target buildtests
      - name: Run the test suites and the examples
        run: UBSAN_OPTIONS=print_stacktrace=1 ctest --test-dir build --output-on-failure

  gpu-cuda:
    # Cross-compilation of the GPU examples with the oldest CUDA
    # release the headers support. The container pins nvcc and its
    # host compiler together, and the CPU suites run in it as usual.
    name: gpu examples build only (nvcc 12.0, gcc 11)
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.0.1-devel-ubuntu22.04
    steps:
      - name: Install cmake and git
        # The CMake of Ubuntu 22.04 (3.22) predates CUDA 12: this job
        # also covers the by-hand C++20 request of the examples.
        run: apt-get update && apt-get install -y cmake git
      - uses: actions/checkout@v4
      - name: Configure
        # The architecture must be explicit: the `native` default
        # probes for a device.
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DTDLS_BUILD_CUDA_EXAMPLES=ON
          -DCMAKE_CUDA_ARCHITECTURES=80
      - name: Build
        run: cmake --build build -j4 --target buildtests
      - name: Run the test suites and the examples (GPU examples skip)
        run: ctest --test-dir build --output-on-failure

  gpu-hip:
    # Same for AMD, with the oldest ROCm release that has packages for
    # a GitHub-hosted image (5.3 on Ubuntu 22.04, clang 15). Only the
    # HIP compiler, runtime and device libraries are installed, and
    # the examples go through the HIP language of CMake.
    name: gpu examples build only (ROCm 5.3, clang 15)
    runs-on: ubuntu-22.04
    env:
      ROCM_PATH: /opt/rocm
    steps:
      - uses: actions/checkout@v4
      - name: Install the ROCm 5.3 HIP toolchain
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.radeon.com/rocm/rocm.gpg.key \
            | gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/5.3 jammy main" \
            | sudo tee /etc/apt/sources.list.d/rocm.list
          sudo apt-get update
          sudo apt-get install -y hip-dev hip-runtime-amd rocm-device-libs
          echo "/opt/rocm/bin" >> "$GITHUB_PATH"
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DTDLS_BUILD_HIP_EXAMPLES=ON
          -DCMAKE_HIP_COMPILER=/opt/rocm/llvm/bin/clang++
          -DCMAKE_HIP_PLATFORM=amd
          -DCMAKE_HIP_ARCHITECTURES=gfx90a
      - name: Configure diagnostics
        if: failure()
        run: |
          ls -la /opt/rocm/ /opt/rocm/llvm/bin/clang++ /opt/rocm/bin/hipconfig || true
          /opt/rocm/llvm/bin/clang++ -v -print-targets 2>&1 | head -20 || true
          hipconfig --rocmpath || true
          cat build/CMakeFiles/CMakeConfigureLog.yaml || true
      - name: Build
        run: cmake --build build -j4 --target buildtests
      - name: Run the test suites and the examples (GPU examples skip)
        run: ctest --test-dir build --output-on-failure

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: pip install "clang-format==22.*"
      - name: Check the formatting
        run: git ls-files '*.hpp' '*.cpp' '*.cu' | xargs clang-format --dry-run --Werror

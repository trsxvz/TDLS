# Builds the library, runs the test suites and the examples, and gates
# the formatting on every push and pull request.
# GitHub-hosted runners have no GPU, but the GPU compilers only need a
# device to run, not to compile: the gpu jobs build the GPU examples
# with the oldest supported CUDA and ROCm releases and with clang as a
# second CUDA frontend, and the examples report themselves skipped at
# run time (exit code 77). The stdpar device offloads are built the
# same way, one job per vendor: nvc++, the ROCm hipstdpar toolchain
# and the oneAPI pstl offload. Running any of them for real stays on
# machines that have a device.
# The test suites compile at -O3 in the GCC and Clang jobs, the default
# of TDLS_TESTS_OPTIMIZATION and the level of the Release builds, which
# exercises the optimizer the most. The sanitizer job compiles at -O1.
# The packages that the spack job builds go to a Spack binary cache on
# the GitHub container registry (setup-build-cache, push-build-cache,
# update_build_cache, clean-build-cache.yml). Only the runs on main
# write it; a pull request only reads it, and from a fork its token is
# read-only. Keep it that way: never enable "Send write tokens to
# workflows from pull requests", never trigger on pull_request_target.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Every night, even without a commit: the Spack binary cache follows
  # the latest dependencies, and a change of the runner images or of the
  # Spack packages shows up. Not at the start of an hour, when GitHub
  # delays the scheduled runs the most.
  schedule:
    - cron: 17 2 * * *
  workflow_dispatch:

env:
  # Spack binary cache of the spack job, on the GitHub container registry
  BUILD_CACHE: oci://ghcr.io/${{ github.repository_owner }}/tdls-spack-buildcache

jobs:
  tests:
    # The current GCC and Clang of the runner image. The other jobs
    # cover the compiler floors, MSVC and the GPU toolchains.
    name: tests (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Install the LLVM OpenMP runtime and oneTBB
        run: sudo apt-get update && sudo apt-get install -y libomp-dev libtbb-dev
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - name: Build
        run: cmake --build build -j4 --target buildtests
      - name: Run the test suites and the examples
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: tests (g++, ASan+UBSan, -O1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the LLVM OpenMP runtime and oneTBB
        run: sudo apt-get update && sudo apt-get install -y libomp-dev libtbb-dev
      - name: Configure
        # -O1 is the level recommended for AddressSanitizer: higher levels
        # keep more values in registers or remove accesses, and their
        # checks with them. Under the instrumentation, -O2 also compiles
        # about 5 times slower. The Release flags are lowered as well,
        # for the examples and the snippets.
        # -fno-sanitize-recover makes every UBSan finding fatal too, so
        # ctest actually fails instead of passing over printed errors.
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_CXX_FLAGS_RELEASE="-O1 -DNDEBUG"
          -DTDLS_TESTS_OPTIMIZATION=-O1
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
      - name: Build
        run: cmake --build build -j4 --target buildtests
      - name: Run the test suites and the examples
        run: UBSAN_OPTIONS=print_stacktrace=1 ctest --test-dir build --output-on-failure

  floors:
    # Ensures the advertised compiler floors keep compiling and passing:
    # GCC 10 and Clang 12 are the oldest releases the documentation
    # claims. ubuntu-22.04 is pinned because 24.04 dropped the clang-12
    # package. The CUDA and ROCm floors are covered by the gpu jobs.
    name: floor (${{ matrix.compiler }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: g++-10
            packages: g++-10
          - compiler: clang++-12
            packages: clang-12 libomp-12-dev
    steps:
      - uses: actions/checkout@v4
      - name: Install the floor compiler and oneTBB
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }} libtbb-dev
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - name: Build
        run: cmake --build build -j4 --target buildtests
      - name: Run the test suites and the examples
        run: ctest --test-dir build --output-on-failure

  windows:
    # MSVC coverage. The windows-2019 runner is retired, so the VS 2019
    # 16.11 floor of the documentation is not reachable here; this job
    # keeps the MSVC branches compiling and passing on the current
    # toolset.
    name: tests (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release -j4 --target buildtests
      - name: Run the test suites and the examples
        run: ctest --test-dir build -C Release --output-on-failure

  spack:
    # Installs the library with the tdls recipe of Spack and runs the
    # test suites and the examples through it, as `spack install
    # --test=root` does for users. The recipe is only in the develop
    # branch of spack-packages, not in its releases. `spack develop`
    # builds the checked out sources instead of the main branch fetched
    # by the recipe. The runner provides CMake and oneTBB, as in the
    # other jobs.
    # The packages that Spack builds, all but tdls, go to a binary cache
    # on the GitHub container registry, BUILD_CACHE, as in mfem-mgis.
    # Every run reads it, the runs on main write it, and
    # update_build_cache then removes the packages they no longer use.
    # The first run on main creates the package of the cache, private
    # until its visibility is changed in its settings.
    name: Spack 1.2.2 install and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_USER: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install oneTBB
        run: sudo apt-get update && sudo apt-get install -y libtbb-dev
      - name: Set up Spack
        uses: spack/setup-spack@v3
        with:
          spack_ref: v1.2.2
          packages_ref: develop
          buildcache: false
          spack_path: spack
      - name: Set up the build cache
        uses: ./.github/actions/setup-build-cache
      - name: Install the dependencies of tdls
        # The test dependencies take part in the concretization: an
        # environment concretized without them builds tdls without its
        # tests, even under install --test=root.
        run: |
          env=${{ runner.temp }}/tdls-env
          spack external find cmake
          spack env create -d $env
          spack -e $env add tdls@main
          spack -e $env develop --no-clone --path ${{ github.workspace }} tdls@main
          spack -e $env concretize --test=root
          spack -e $env install --only dependencies --test=root
      # tdls itself is never cached, so that it is always built and tested.
      # Its build dependencies are only installed with it, and pushed after.
      - name: Push the dependencies to the build cache
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/push-build-cache
        with:
          artifact: used-hashes-spack
          exclude: tdls
      - name: Install tdls and run its tests
        id: install
        run: spack -e ${{ runner.temp }}/tdls-env install --test=root
      - name: Show the output of the tests
        # Spack only reports that the check target failed: the output of
        # the build of the tests and of ctest stays in the stage directory.
        if: failure() && steps.install.outcome == 'failure'
        run: |
          stage=$(spack -e ${{ runner.temp }}/tdls-env location --stage-dir tdls)
          tail -n 200 "$stage/install-time-test-log.txt"
      - name: Push the build dependencies to the build cache
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/push-build-cache
        with:
          artifact: used-hashes-spack
          exclude: tdls
      - name: Build a project against the installed package
        # The tests run in the build tree: this checks that a project
        # finds the installed tdls with find_package.
        run: |
          consumer=${{ runner.temp }}/consumer
          mkdir -p $consumer
          cat > $consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.21)
          project(consumer LANGUAGES CXX)
          find_package(tdls REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE tdls::tdls)
          EOF
          cat > $consumer/main.cpp <<'EOF'
          #include <cstdio>
          #include <tdls/tdls.hpp>
          int main() { std::puts(TDLS_VERSION_STRING); }
          EOF
          cmake -S $consumer -B $consumer/build \
            -DCMAKE_PREFIX_PATH=$(spack -e ${{ runner.temp }}/tdls-env location -i tdls)
          cmake --build $consumer/build
          $consumer/build/consumer

  update_build_cache:
    # Once the spack job has pushed, removes from the build cache the
    # packages that it no longer uses, when it succeeded, then updates
    # the index of the cache. Only on main, which writes the cache.
    needs: spack
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Spack
        uses: spack/setup-spack@v3
        with:
          spack_ref: v1.2.2
          packages_ref: develop
          buildcache: false
          spack_path: spack
      - name: Clean the build cache
        uses: ./.github/actions/clean-build-cache
        env:
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          prune: ${{ needs.spack.result == 'success' }}

  gpu-cuda:
    # Cross-compilation of the GPU examples with the oldest CUDA
    # release the headers support. The container pins nvcc and its
    # host compiler together, and the CPU suites run in it as usual.
    # The image comes from the registry of NVIDIA: the same image as on
    # Docker Hub, same digest, without its limit on anonymous pulls,
    # which the shared addresses of the runners reach.
    name: gpu examples build only (nvcc 12.0, gcc 11)
    runs-on: ubuntu-latest
    container: nvcr.io/nvidia/cuda:12.0.1-devel-ubuntu22.04
    steps:
      - name: Install cmake and git
        # The CMake of Ubuntu 22.04 (3.22) predates CUDA 12: this job
        # also covers the by-hand C++20 request of the examples.
        run: apt-get update && apt-get install -y cmake git
      - uses: actions/checkout@v4
      - name: Configure
        # The architecture must be explicit: the `native` default
        # probes for a device.
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DTDLS_BUILD_CUDA_EXAMPLES=ON
          -DCMAKE_CUDA_ARCHITECTURES=80
      - name: Build
        run: cmake --build build -j4 --target buildtests
      - name: Run the test suites and the examples (GPU examples skip)
        run: ctest --test-dir build --output-on-failure

  gpu-clang-cuda:
    # Second CUDA frontend: clang compiles the same examples against the
    # toolkit of the container. CUDA 12.3 is the newest release clang 18
    # fully supports, so the pairing raises no version warning. The
    # image comes from the registry of NVIDIA, as above.
    name: gpu examples build only (clang 18 CUDA, CUDA 12.3)
    runs-on: ubuntu-latest
    container: nvcr.io/nvidia/cuda:12.3.2-devel-ubuntu22.04
    steps:
      - name: Install cmake, git and clang 18 (apt.llvm.org)
        run: |
          apt-get update && apt-get install -y cmake git wget gnupg
          mkdir -p /etc/apt/keyrings
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor > /etc/apt/keyrings/llvm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/llvm.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" \
            > /etc/apt/sources.list.d/llvm.list
          apt-get update && apt-get install -y clang-18
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DTDLS_BUILD_CUDA_EXAMPLES=ON
          -DCMAKE_CUDA_COMPILER=clang++-18
          -DCMAKE_CUDA_ARCHITECTURES=80
      - name: Build
        run: cmake --build build -j4 --target buildtests
      - name: Run the test suites and the examples (GPU examples skip)
        run: ctest --test-dir build --output-on-failure

  gpu-hip:
    # Same for AMD, with the oldest ROCm release that has packages for a
    # GitHub-hosted image (5.3 on Ubuntu 22.04, clang 15). Only the HIP
    # compiler, runtime and device libraries are installed, and the
    # examples go through the HIP language of CMake, for a wavefront of
    # 64 lanes (gfx90a) and one of 32 (gfx1030): the deduced barrier of
    # the cooperative solvers depends on the wavefront size.
    name: gpu examples build only (ROCm 5.3, clang 15)
    runs-on: ubuntu-22.04
    env:
      ROCM_PATH: /opt/rocm
    steps:
      - uses: actions/checkout@v4
      - name: Install the ROCm 5.3 HIP toolchain
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.radeon.com/rocm/rocm.gpg.key \
            | gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/5.3 jammy main" \
            | sudo tee /etc/apt/sources.list.d/rocm.list
          # Ubuntu ships its own rocm-device-libs (5.0.0-1) in universe,
          # which apt would prefer over the AMD build (1.0.0.50300) and
          # which does not install under /opt/rocm: pin the AMD repository.
          printf 'Package: *\nPin: release o=repo.radeon.com\nPin-Priority: 600\n' \
            | sudo tee /etc/apt/preferences.d/rocm-pin-600
          sudo apt-get update
          sudo apt-get install -y hip-dev hip-runtime-amd rocm-device-libs
          echo "/opt/rocm/bin" >> "$GITHUB_PATH"
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DTDLS_BUILD_HIP_EXAMPLES=ON
          -DCMAKE_HIP_COMPILER=/opt/rocm/llvm/bin/clang++
          -DCMAKE_HIP_PLATFORM=amd
          "-DCMAKE_HIP_ARCHITECTURES=gfx90a;gfx1030"
      - name: Configure diagnostics
        if: failure()
        run: |
          ls -la /opt/rocm/ /opt/rocm/llvm/bin/clang++ /opt/rocm/bin/hipconfig || true
          /opt/rocm/llvm/bin/clang++ -v -print-targets 2>&1 | head -20 || true
          hipconfig --rocmpath || true
          cat build/CMakeFiles/CMakeConfigureLog.yaml || true
      - name: Build
        run: cmake --build build -j4 --target buildtests
      - name: Run the test suites and the examples (GPU examples skip)
        run: ctest --test-dir build --output-on-failure

  gpu-sycl:
    # Build-only check of the SYCL examples with the oneAPI DPC++
    # compiler: icpx targets spir64 SPIR-V by default, so no device is
    # needed at compile time and the binaries serve Intel GPUs at run
    # time. With the CUDA and ROCm jobs this covers the three GPU
    # vendors. Only the SYCL targets are built: the CPU suites are
    # covered by the other jobs.
    name: gpu examples build only (icpx, SYCL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the oneAPI DPC++ compiler
        run: |
          curl -fsSL https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | sudo gpg --dearmor -o /usr/share/keyrings/oneapi.gpg
          echo "deb [signed-by=/usr/share/keyrings/oneapi.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneapi.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-compiler-dpcpp-cpp
      - name: Configure
        run: |
          source /opt/intel/oneapi/setvars.sh
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTDLS_BUILD_TESTS=OFF \
            -DCMAKE_CXX_COMPILER=icpx -DTDLS_BUILD_SYCL_EXAMPLES=ON
      - name: Build the SYCL targets
        run: |
          source /opt/intel/oneapi/setvars.sh
          cmake --build build -j4 --target \
            tdls_example_tiledlupp_implicit_ode_batch_sycl \
            tdls_example_tiledlupp_integral_equation_batch_sycl \
            tdls_example_tiledlupp_norton_law_batch_sycl \
            tdls_example_cooperativelupp_implicit_ode_batch_sycl \
            tdls_example_cooperativelupp_integral_equation_batch_sycl \
            tdls_example_cooperativelupp_norton_law_batch_sycl \
            tdls_example_arrowheadlupp_aggregate_batch_sycl \
            tdls_example_arrowheadlupp_iwan_batch_sycl \
            tdls_example_arrowheadlupp_polycrystal_batch_sycl

  gpu-stdpar-nvhpc:
    # Build-only check of the parallel STL offload with nvc++. The HPC
    # SDK has no compilers-only package: dpkg path-exclude filters
    # comm_libs, math_libs, profilers and examples at unpack time,
    # -stdpar=gpu needing compilers/ and cuda/ only. Capability check,
    # not a floor.
    name: gpu stdpar examples build only (nvc++ 25.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the HPC SDK compiler and CUDA components
        run: |
          printf 'path-exclude=/opt/nvidia/hpc_sdk/*/comm_libs/*\npath-exclude=/opt/nvidia/hpc_sdk/*/math_libs/*\npath-exclude=/opt/nvidia/hpc_sdk/*/profilers/*\npath-exclude=/opt/nvidia/hpc_sdk/*/examples/*\n' \
            | sudo tee /etc/dpkg/dpkg.cfg.d/nvhpc-slim
          curl -fsSL https://developer.download.nvidia.com/hpc-sdk/ubuntu/DEB-GPG-KEY-NVIDIA-HPC-SDK \
            | sudo gpg --dearmor -o /usr/share/keyrings/nvidia-hpcsdk.gpg
          echo 'deb [signed-by=/usr/share/keyrings/nvidia-hpcsdk.gpg] https://developer.download.nvidia.com/hpc-sdk/ubuntu/amd64 /' \
            | sudo tee /etc/apt/sources.list.d/nvhpc.list
          sudo apt-get update
          sudo apt-get install -y nvhpc-25-11
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DTDLS_BUILD_TESTS=OFF
          -DCMAKE_CXX_COMPILER=/opt/nvidia/hpc_sdk/Linux_x86_64/25.11/compilers/bin/nvc++
          -DTDLS_BUILD_STDPAR_DEVICE_EXAMPLES=ON
          -DTDLS_STDPAR_DEVICE_FLAGS="-stdpar=gpu -gpu=cc80"
      - name: Build the device targets
        run: >
          cmake --build build -j4 --target
          tdls_example_tiledlupp_implicit_ode_batch_stdpar_gpu
          tdls_example_tiledlupp_integral_equation_batch_stdpar_gpu
          tdls_example_tiledlupp_norton_law_batch_stdpar_gpu
          tdls_example_cooperativelupp_implicit_ode_batch_stdpar_gpu
          tdls_example_cooperativelupp_integral_equation_batch_stdpar_gpu
          tdls_example_cooperativelupp_norton_law_batch_stdpar_gpu
          tdls_example_cooperativelupp_norton_law_batch_stdpar_groups_gpu
          tdls_example_arrowheadlupp_aggregate_batch_stdpar_gpu
          tdls_example_arrowheadlupp_iwan_batch_stdpar_gpu
          tdls_example_arrowheadlupp_polycrystal_batch_stdpar_gpu

  gpu-stdpar-hip:
    # Build-only check of the parallel STL offload with the ROCm clang
    # through --hipstdpar. The forwarding header is not packaged by
    # ROCm and comes from the roc-stdpar repository, pinned by commit;
    # it carries a #warning, silenced so the -Werror of the examples
    # holds. rocThrust and rocPrim back the device algorithms, oneTBB
    # the host-side ones.
    name: gpu stdpar examples build only (ROCm 6.2, hipstdpar)
    runs-on: ubuntu-22.04
    env:
      ROCM_PATH: /opt/rocm
    steps:
      - uses: actions/checkout@v4
      - name: Install the ROCm 6.2 toolchain, roc-stdpar and oneTBB
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.radeon.com/rocm/rocm.gpg.key \
            | gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/6.2.4 jammy main" \
            | sudo tee /etc/apt/sources.list.d/rocm.list
          printf 'Package: *\nPin: release o=repo.radeon.com\nPin-Priority: 600\n' \
            | sudo tee /etc/apt/preferences.d/rocm-pin-600
          sudo apt-get update
          sudo apt-get install -y hip-dev hip-runtime-amd rocm-device-libs rocm-llvm \
            rocthrust-dev rocprim-dev libtbb-dev
          git clone https://github.com/ROCm/roc-stdpar "$HOME/roc-stdpar"
          git -C "$HOME/roc-stdpar" checkout 5c7f44d8418273671671378871afc00fddc4aa14
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DTDLS_BUILD_TESTS=OFF
          -DCMAKE_CXX_COMPILER=/opt/rocm/llvm/bin/clang++
          -DTDLS_BUILD_STDPAR_DEVICE_EXAMPLES=ON
          -DTDLS_STDPAR_DEVICE_FLAGS="--hipstdpar
          --hipstdpar-path=$HOME/roc-stdpar/include --offload-arch=gfx90a
          -Wno-#warnings"
      - name: Build the device targets
        run: >
          cmake --build build -j4 --target
          tdls_example_tiledlupp_implicit_ode_batch_stdpar_gpu
          tdls_example_tiledlupp_integral_equation_batch_stdpar_gpu
          tdls_example_tiledlupp_norton_law_batch_stdpar_gpu
          tdls_example_cooperativelupp_implicit_ode_batch_stdpar_gpu
          tdls_example_cooperativelupp_integral_equation_batch_stdpar_gpu
          tdls_example_cooperativelupp_norton_law_batch_stdpar_gpu
          tdls_example_arrowheadlupp_aggregate_batch_stdpar_gpu
          tdls_example_arrowheadlupp_iwan_batch_stdpar_gpu
          tdls_example_arrowheadlupp_polycrystal_batch_stdpar_gpu

  gpu-stdpar-oneapi:
    # Build-only check of the parallel STL offload with icpx through
    # the oneAPI pstl offload, backed by oneDPL. Capability check, not
    # a floor.
    name: gpu stdpar examples build only (icpx, pstl offload)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the oneAPI DPC++ compiler and oneDPL
        run: |
          curl -fsSL https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | sudo gpg --dearmor -o /usr/share/keyrings/oneapi.gpg
          echo "deb [signed-by=/usr/share/keyrings/oneapi.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneapi.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-compiler-dpcpp-cpp intel-oneapi-libdpstd-devel
      - name: Configure
        run: |
          source /opt/intel/oneapi/setvars.sh
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTDLS_BUILD_TESTS=OFF \
            -DCMAKE_CXX_COMPILER=icpx -DTDLS_BUILD_STDPAR_DEVICE_EXAMPLES=ON \
            -DTDLS_STDPAR_DEVICE_FLAGS="-fsycl -fsycl-pstl-offload=gpu"
      - name: Build the device targets
        run: |
          source /opt/intel/oneapi/setvars.sh
          cmake --build build -j4 --target \
            tdls_example_tiledlupp_implicit_ode_batch_stdpar_gpu \
            tdls_example_tiledlupp_integral_equation_batch_stdpar_gpu \
            tdls_example_tiledlupp_norton_law_batch_stdpar_gpu \
            tdls_example_cooperativelupp_implicit_ode_batch_stdpar_gpu \

# Builds the documentation site (Sphinx pages + Doxygen API reference)
# for main and every release tag, and deploys it to GitHub Pages.
name: docs

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install graphviz and doxygen
        run: |
          sudo apt-get update && sudo apt-get install -y graphviz
          curl -sL https://github.com/doxygen/doxygen/releases/download/Release_1_12_0/doxygen-1.12.0.linux.bin.tar.gz | tar xz
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sphinx
        run: pip install -r docs/requirements.txt
      - name: Build the site, one directory per version
        run: DOXYGEN="$PWD/doxygen-1.12.0/bin/doxygen" docs/build_site.sh _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
